<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Nacional de Personas Buscadas — Prototipo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --navy-900:#0A1B33;
  --navy-800:#0F2547;
  --navy-700:#153466;
  --gold-500:#C8A24A;
  --gold-300:#E4CD8F;
  --red-600:#9C2B3A;
  --red-700:#7C2130;
  --paper-50:#F6F3EC;
  --paper-100:#EFEAE0;
  --ink-900:#181614;
  --ink-600:#4A4640;
  --gray-400:#8B8B85;
  --line:#D8D2C2;
  --ok-600:#3F6B4A;
  --radius:2px;
  --shadow:0 6px 24px rgba(10,27,51,0.12);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper-50);
  color:var(--ink-900);
  font-family:'IBM Plex Sans',sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,h4{font-family:'Source Serif 4',serif;margin:0;color:var(--navy-900);}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
.mono{font-family:'IBM Plex Mono',monospace;}
::selection{background:var(--gold-300);}

/* ---------- Top institutional strip ---------- */
.topstrip{
  background:var(--navy-900);
  color:var(--paper-100);
  font-size:12px;
  letter-spacing:.04em;
  padding:6px 24px;
  display:flex;
  justify-content:space-between;
  border-bottom:3px solid var(--gold-500);
}
.topstrip span{opacity:.85;}

/* ---------- Header ---------- */
header.site{
  background:var(--navy-900);
  color:#fff;
  padding:18px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:14px;
}
.brand{display:flex;align-items:center;gap:14px;}
.crest{width:46px;height:46px;flex:none;}
.brand-text h1{color:#fff;font-size:20px;line-height:1.2;letter-spacing:.01em;}
.brand-text p{margin:2px 0 0;font-size:11.5px;color:var(--gold-300);letter-spacing:.08em;text-transform:uppercase;}
nav.main{display:flex;gap:4px;flex-wrap:wrap;}
nav.main button{
  background:transparent;border:1px solid transparent;color:#EDE7D8;
  padding:9px 16px;font-size:13.5px;font-weight:500;border-radius:var(--radius);
  transition:.15s;
}
nav.main button:hover{background:rgba(255,255,255,.08);}
nav.main button.active{background:var(--gold-500);color:var(--navy-900);font-weight:600;}
nav.main button:focus-visible{outline:2px solid var(--gold-300);outline-offset:2px;}

/* ---------- Hero ---------- */
.hero{
  background:linear-gradient(180deg,var(--navy-900) 0%, var(--navy-800) 55%, var(--navy-700) 100%);
  color:#fff;
  padding:56px 24px 64px;
  position:relative;
  overflow:hidden;
}
.hero::after{
  content:"";position:absolute;inset:0;
  background-image:repeating-linear-gradient(115deg, rgba(255,255,255,.025) 0 2px, transparent 2px 40px);
  pointer-events:none;
}
.hero-inner{max-width:1180px;margin:0 auto;position:relative;}
.eyebrow{color:var(--gold-300);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin-bottom:14px;}
.hero h2{color:#fff;font-size:clamp(28px,4vw,44px);max-width:760px;line-height:1.15;font-weight:700;}
.hero p.lead{color:#D9DEE8;max-width:620px;margin-top:14px;font-size:15.5px;line-height:1.6;}
.stat-row{display:flex;gap:28px;margin-top:34px;flex-wrap:wrap;}
.stat{border-left:2px solid var(--gold-500);padding-left:14px;}
.stat .n{font-family:'Source Serif 4',serif;font-size:30px;font-weight:700;color:#fff;}
.stat .l{font-size:12px;color:#B9C2D4;text-transform:uppercase;letter-spacing:.06em;}

.searchbar{
  margin-top:36px;background:#fff;border-radius:var(--radius);padding:16px;
  display:flex;gap:10px;flex-wrap:wrap;box-shadow:var(--shadow);
}
.searchbar input[type=text]{
  flex:2;min-width:200px;border:1px solid var(--line);padding:11px 12px;font-size:14px;border-radius:var(--radius);color:var(--ink-900);
}
.searchbar select{
  flex:1;min-width:140px;border:1px solid var(--line);padding:11px 10px;font-size:14px;border-radius:var(--radius);color:var(--ink-900);background:#fff;
}
.searchbar input:focus,.searchbar select:focus{outline:2px solid var(--navy-700);outline-offset:1px;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:8px;border:none;padding:11px 20px;
  font-size:13.5px;font-weight:600;border-radius:var(--radius);letter-spacing:.01em;
}
.btn-gold{background:var(--gold-500);color:var(--navy-900);}
.btn-gold:hover{background:var(--gold-300);}
.btn-navy{background:var(--navy-800);color:#fff;}
.btn-navy:hover{background:var(--navy-700);}
.btn-outline{background:transparent;border:1px solid var(--navy-700);color:var(--navy-900);}
.btn-outline:hover{background:var(--navy-900);color:#fff;}
.btn-red{background:var(--red-600);color:#fff;}
.btn-red:hover{background:var(--red-700);}
.btn-ghost{background:transparent;color:var(--ink-600);border:1px solid var(--line);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-sm{padding:7px 12px;font-size:12.5px;}
.btn:focus-visible{outline:2px solid var(--navy-700);outline-offset:2px;}

/* ---------- Main container ---------- */
main{max-width:1180px;margin:0 auto;padding:44px 24px 90px;}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
.section-head h3{font-size:22px;}
.section-head .sub{color:var(--ink-600);font-size:13.5px;margin-top:4px;}
.tag-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px;}
.tag-filters button{
  background:#fff;border:1px solid var(--line);padding:7px 14px;font-size:12.5px;border-radius:20px;color:var(--ink-600);font-weight:500;
}
.tag-filters button.active{background:var(--navy-900);color:#fff;border-color:var(--navy-900);}

/* ---------- Calendario ---------- */
.cal-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:0 1px 3px rgba(10,27,51,.06);margin-bottom:28px;}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.cal-head h4{font-size:18px;}
.cal-nav{display:flex;gap:8px;}
.cal-nav button{background:var(--paper-100);border:1px solid var(--line);width:34px;height:34px;border-radius:var(--radius);font-size:15px;color:var(--navy-900);}
.cal-nav button:hover{background:var(--navy-900);color:#fff;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-dow{text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-400);padding-bottom:4px;font-weight:600;}
.cal-day{
  position:relative;min-height:64px;border:1px solid var(--paper-100);border-radius:var(--radius);
  padding:6px 6px;font-size:13px;color:var(--ink-900);background:#fff;text-align:left;
  display:flex;flex-direction:column;justify-content:flex-start;gap:4px;
}
.cal-day:hover{border-color:var(--navy-700);}
.cal-day.empty{background:transparent;border-color:transparent;}
.cal-day.has-casos{background:var(--paper-100);}
.cal-day.selected{border-color:var(--gold-500);border-width:2px;background:#fff;box-shadow:0 0 0 1px var(--gold-500);}
.cal-day .dnum{font-weight:600;}
.cal-day .dots{display:flex;gap:3px;flex-wrap:wrap;}
.cal-dot{width:7px;height:7px;border-radius:50%;}
.cal-dot.desaparecido{background:var(--navy-700);}
.cal-dot.buscado{background:var(--red-600);}
.cal-count{font-size:10px;color:var(--ink-600);}
.cal-legend{display:flex;gap:18px;margin-top:14px;font-size:12px;color:var(--ink-600);flex-wrap:wrap;}
.cal-legend span{display:flex;align-items:center;gap:6px;}
.cal-today-btn{font-size:12px;color:var(--navy-700);text-decoration:underline;background:none;border:none;padding:0;}

/* ---------- Case grid / ficha cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;}
.ficha{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  box-shadow:0 1px 3px rgba(10,27,51,.06);position:relative;display:flex;flex-direction:column;
  transition:.15s;
}
.ficha:hover{box-shadow:var(--shadow);transform:translateY(-2px);}
.ficha-photo{
  height:180px;background:linear-gradient(135deg,var(--navy-800),var(--navy-700));
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
}
.ficha-photo img{width:100%;height:100%;object-fit:cover;}
.ficha-photo svg{width:64px;height:64px;opacity:.35;}
.ribbon{
  position:absolute;top:12px;left:-34px;transform:rotate(-40deg);
  padding:4px 40px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);
}
.ribbon.buscado{background:var(--red-600);}
.ribbon.desaparecido{background:var(--navy-700);}
.case-no{position:absolute;bottom:8px;right:10px;font-size:10.5px;color:#EDE7D8;background:rgba(0,0,0,.35);padding:2px 7px;border-radius:2px;}
.alerta-badge{position:absolute;top:10px;right:10px;background:var(--gold-500);color:var(--navy-900);font-size:10px;font-weight:700;padding:3px 8px;border-radius:12px;letter-spacing:.04em;}
.ficha-body{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column;}
.ficha-body h4{font-size:16.5px;margin-bottom:4px;}
.meta-row{font-size:12px;color:var(--ink-600);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.desc{font-size:13px;color:var(--ink-600);line-height:1.5;flex:1;margin-bottom:12px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.ficha-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--paper-100);padding-top:10px;}
.status-pill{font-size:10.5px;padding:3px 9px;border-radius:10px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
.status-pill.pendiente{background:#F2E3C6;color:#7A5A17;}
.status-pill.publicado{background:#DCEBDF;color:var(--ok-600);}
.status-pill.rechazado{background:#F0D9DB;color:var(--red-700);}
.empty-state{
  border:1px dashed var(--line);border-radius:var(--radius);padding:50px 20px;text-align:center;color:var(--ink-600);
  background:#fff;
}
.empty-state h4{margin-bottom:6px;color:var(--navy-900);}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,20,35,.55);display:flex;align-items:flex-start;justify-content:center;
  padding:40px 16px;overflow-y:auto;z-index:50;}
.modal{background:#fff;border-radius:var(--radius);max-width:640px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .15s ease;}
@keyframes pop{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--paper-100);display:flex;justify-content:space-between;align-items:center;}
.modal-body{padding:24px;}
.modal-close{background:none;border:none;font-size:20px;color:var(--ink-600);line-height:1;padding:4px 8px;}
.detail-photo{width:100%;height:260px;background:linear-gradient(135deg,var(--navy-800),var(--navy-700));border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;margin-bottom:18px;overflow:hidden;position:relative;}
.detail-photo img{width:100%;height:100%;object-fit:cover;}
.detail-photo svg{width:80px;height:80px;opacity:.35;}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
.field-grid .full{grid-column:1/-1;}
.field-grid label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-400);margin-bottom:3px;}
.field-grid .val{font-size:14.5px;color:var(--ink-900);}
.alert-box{background:var(--paper-100);border-left:3px solid var(--gold-500);padding:12px 14px;font-size:12.5px;color:var(--ink-600);border-radius:0 var(--radius) var(--radius) 0;margin-top:6px;}

/* ---------- Forms ---------- */
.form-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:32px;max-width:760px;margin:0 auto;box-shadow:0 1px 3px rgba(10,27,51,.06);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.form-grid .full{grid-column:1/-1;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-900);}
.field .hint{font-size:11.5px;color:var(--gray-400);}
.field input,.field select,.field textarea{
  border:1px solid var(--line);padding:10px 12px;font-size:14px;border-radius:var(--radius);font-family:inherit;color:var(--ink-900);background:#fff;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--navy-700);outline-offset:1px;}
.field textarea{resize:vertical;min-height:90px;}
.form-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:8px;border-top:1px solid var(--paper-100);padding-top:20px;}
.helper-note{background:var(--paper-100);border-radius:var(--radius);padding:14px 16px;font-size:12.5px;color:var(--ink-600);margin-bottom:24px;border-left:3px solid var(--navy-700);line-height:1.6;}
.helper-note b{color:var(--navy-900);}

/* ---------- Login ---------- */
.login-wrap{display:flex;justify-content:center;padding:50px 16px 90px;}
.login-card{background:#fff;border:1px solid var(--line);width:100%;max-width:400px;padding:38px 34px;border-radius:var(--radius);box-shadow:var(--shadow);text-align:center;}
.login-card .crest{width:52px;height:52px;margin:0 auto 14px;}
.login-card h3{font-size:19px;margin-bottom:4px;}
.login-card p.sub{font-size:12.5px;color:var(--ink-600);margin-bottom:26px;}
.login-card .field{text-align:left;}
.err-msg{background:#F0D9DB;color:var(--red-700);font-size:12.5px;padding:9px 12px;border-radius:var(--radius);margin-bottom:16px;text-align:left;}
.demo-note{margin-top:20px;font-size:11.5px;color:var(--gray-400);border-top:1px dashed var(--line);padding-top:14px;}

/* ---------- Panel privado ---------- */
.panel-top{background:var(--navy-900);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.panel-top .who{font-size:12.5px;color:var(--gold-300);}
.panel-tabs{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:0 24px;flex-wrap:wrap;position:sticky;top:0;z-index:10;}
.panel-tabs button{padding:14px 16px;background:none;border:none;font-size:13.5px;font-weight:500;color:var(--ink-600);border-bottom:3px solid transparent;}
.panel-tabs button.active{color:var(--navy-900);border-color:var(--gold-500);font-weight:700;}
.badge-count{background:var(--red-600);color:#fff;font-size:10px;border-radius:10px;padding:1px 6px;margin-left:5px;}
.table-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{background:var(--paper-100);text-align:left;padding:10px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-600);}
td{padding:11px 14px;border-top:1px solid var(--paper-100);vertical-align:middle;}
tr:hover td{background:#FBFAF6;}
.mini-badge{font-size:10.5px;padding:2px 8px;border-radius:10px;font-weight:600;}
.mini-badge.buscado{background:#F0D9DB;color:var(--red-700);}
.mini-badge.desaparecido{background:#DCE4F2;color:var(--navy-800);}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:28px;}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
.stat-card .n{font-family:'Source Serif 4',serif;font-size:28px;font-weight:700;color:var(--navy-900);}
.stat-card .l{font-size:12px;color:var(--ink-600);margin-top:2px;}

/* ---------- Footer ---------- */
footer{background:var(--navy-900);color:#B9C2D4;padding:34px 24px;font-size:12.5px;text-align:center;}
footer .disclaimer{max-width:720px;margin:0 auto 14px;line-height:1.6;color:#9FA9BE;}
footer .disclaimer b{color:var(--gold-300);}

.toast{position:fixed;bottom:24px;right:24px;background:var(--navy-900);color:#fff;padding:14px 20px;border-radius:var(--radius);
  font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:100;display:flex;align-items:center;gap:10px;border-left:3px solid var(--gold-500);}

@media(max-width:640px){
  .field-grid{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr;}
  header.site{padding:14px 16px;}
  main{padding:30px 16px 70px;}
  .hero{padding:40px 16px 48px;}
}
</style>
</head>
<body>

<div id="root"></div>

<script>
/* ==========================================================================
   DATOS Y PERSISTENCIA
   ========================================================================== */
const DEMO_USERS = [
  { usuario:'investigador', password:'Oij2026*', nombre:'M. Araya', rol:'Investigador/a' },
  { usuario:'admin', password:'Admin2026*', nombre:'Coordinación', rol:'Administrador/a' },
];

let state = {
  view:'inicio',          // inicio | reportar | login | panel
  panelTab:'publicados',  // publicados | pendientes | nuevo | estadisticas
  casos:[],
  session:null,           // {usuario, nombre, rol}
  filtroTexto:'',
  filtroTipo:'todos',
  filtroProvincia:'todas',
  modalCaso:null,
  loginError:'',
  toast:null,
  loading:true,
  calYear: new Date().getFullYear(),
  calMonth: new Date().getMonth(), // 0-11
  calSelected: null, // 'YYYY-MM-DD'
  editCaso: null, // id del expediente que se está editando
};

const PROVINCIAS = ['San José','Alajuela','Cartago','Heredia','Guanacaste','Puntarenas','Limón'];

function uid(){ return 'C-' + Date.now().toString(36).toUpperCase() + '-' + Math.floor(Math.random()*900+100); }

async function cargarCasos(){
  try{
    const res = await withTimeout(window.storage.get('oij-casos', true), 4000);
    state.casos = res && res.value ? JSON.parse(res.value) : semillasIniciales();
    if(!res){ await withTimeout(guardarCasos(), 4000); }
  }catch(e){
    console.warn('No se pudieron cargar los casos guardados, usando datos de ejemplo.', e);
    if(!state.casos || state.casos.length===0) state.casos = semillasIniciales();
  }
  state.loading = false;
  render();
}

function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_,reject)=> setTimeout(()=>reject(new Error('timeout')), ms))
  ]);
}

async function guardarCasos(){
  try{
    await window.storage.set('oij-casos', JSON.stringify(state.casos), true);
  }catch(e){ mostrarToast('No se pudo guardar. Intenta de nuevo.'); }
}

async function cargarSesion(){
  try{
    const res = await withTimeout(window.storage.get('sesion-personal', false), 4000);
    if(res && res.value) state.session = JSON.parse(res.value);
  }catch(e){ /* sin sesión previa o almacenamiento no disponible */ }
}

async function guardarSesion(){
  try{
    if(state.session){
      await window.storage.set('sesion-personal', JSON.stringify(state.session), false);
    } else {
      await window.storage.delete('sesion-personal', false);
    }
  }catch(e){ /* silencioso */ }
}

function semillasIniciales(){
  return [
    {
      id: uid(), tipo:'desaparecido', status:'publicado', nombre:'Marianela Solís Ureña', edad:34, genero:'Femenino',
      provincia:'Alajuela', fecha:'2026-08-02', lugar:'Centro de Alajuela, cerca de la estación del tren',
      descripcion:'Fue vista por última vez saliendo de su trabajo alrededor de las 5:30 p.m. Vestía uniforme azul y no ha tenido contacto con su familia desde entonces.',
      senas:'1.60 m, contextura delgada, cabello negro hasta los hombros, cicatriz pequeña en la ceja izquierda.',
      alerta:true, foto:null, reportadoPor:'personal', contacto:'2222-0000'
    },
    {
      id: uid(), tipo:'buscado', status:'publicado', nombre:'Alias "El Gato" (identidad en verificación)', edad:41, genero:'Masculino',
      provincia:'Limón', fecha:'2026-07-18', lugar:'Zona portuaria de Limón',
      descripcion:'Requerido por presunta relación con delitos contra la propiedad. Se le considera de cuidado; no acercarse.',
      senas:'1.78 m, complexión robusta, tatuaje en el antebrazo derecho.',
      alerta:false, foto:null, reportadoPor:'personal', contacto:'800-8000-645'
    },
    {
      id: uid(), tipo:'desaparecido', status:'pendiente', nombre:'Josué Fernández Mora', edad:16, genero:'Masculino',
      provincia:'Heredia', fecha:'2026-08-20', lugar:'Barrio cerca del colegio, San Francisco de Heredia',
      descripcion:'No regresó a casa después de clases. Un familiar reporta que no llevaba el teléfono celular.',
      senas:'1.70 m, contextura delgada, usa lentes.',
      alerta:true, foto:null, reportadoPor:'ciudadano', contacto:'8888-1234'
    },

   ========================================================================== */
function mostrarToast(msg){
  state.toast = msg;
  render();
  setTimeout(()=>{ state.toast=null; render(); }, 3200);
}

function fmtFecha(f){
  if(!f) return '—';
  const d = new Date(f+'T00:00:00');
  if(isNaN(d)) return f;
  return d.toLocaleDateString('es-CR',{day:'2-digit',month:'short',year:'numeric'});
}

function esc(s){
  return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function casosPublicos(){
  return state.casos.filter(c=>c.status==='publicado');
}

function casosFiltrados(){
  let list = casosPublicos();
  if(state.filtroTipo!=='todos') list = list.filter(c=>c.tipo===state.filtroTipo);
  if(state.filtroProvincia!=='todas') list = list.filter(c=>c.provincia===state.filtroProvincia);
  if(state.filtroTexto.trim()){
    const t = state.filtroTexto.toLowerCase();
    list = list.filter(c => (c.nombre+' '+c.lugar+' '+c.descripcion).toLowerCase().includes(t));
  }
  return list.sort((a,b)=> (b.fecha||'').localeCompare(a.fecha||''));
}

function iconoPersona(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>`;
}
function iconoCrest(){

/* ==========================================================================
   RENDER — CALENDARIO
   ========================================================================== */
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DOW = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

function fechaISO(y,m,d){
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function casosPorFecha(){
  const map = {};
  casosPublicos().forEach(c=>{
    if(!c.fecha) return;
    if(!map[c.fecha]) map[c.fecha] = [];
    map[c.fecha].push(c);
  });
  return map;
}

function renderCalendario(){
  const map = casosPorFecha();
  const y = state.calYear, m = state.calMonth;
  const primerDia = new Date(y,m,1).getDay();
  const diasEnMes = new Date(y,m+1,0).getDate();
  const celdas = [];
  for(let i=0;i<primerDia;i++) celdas.push(null);
  for(let d=1; d<=diasEnMes; d++) celdas.push(d);

  const seleccion = state.calSelected;
  const casosDelDia = seleccion && map[seleccion] ? map[seleccion] : [];

  return `
  <main>
    <div class="section-head">
      <div><h3>Calendario de casos</h3><div class="sub">Escogé una fecha para ver todas las personas reportadas ese día</div></div>
    </div>
    <div class="cal-wrap">
      <div class="cal-head">
        <button class="cal-today-btn" id="cal-hoy">Ir a hoy</button>
        <h4>${MESES[m]} ${y}</h4>
        <div class="cal-nav">
          <button id="cal-prev" aria-label="Mes anterior">‹</button>
          <button id="cal-next" aria-label="Mes siguiente">›</button>
        </div>
      </div>
      <div class="cal-grid">
        ${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${celdas.map(d=>{
          if(d===null) return `<div class="cal-day empty"></div>`;
          const iso = fechaISO(y,m,d);
          const casos = map[iso] || [];
          const tieneDesap = casos.some(c=>c.tipo==='desaparecido');
          const tieneBusc = casos.some(c=>c.tipo==='buscado');
          const sel = seleccion===iso ? 'selected' : '';
          const conCasos = casos.length? 'has-casos':'';
          return `
          <button class="cal-day ${conCasos} ${sel}" data-cal-day="${iso}">
            <span class="dnum">${d}</span>
            ${casos.length? `
              <span class="dots">
                ${tieneDesap? '<span class="cal-dot desaparecido"></span>':''}
                ${tieneBusc? '<span class="cal-dot buscado"></span>':''}
              </span>
              <span class="cal-count">${casos.length} caso${casos.length===1?'':'s'}</span>
            `:''}
          </button>`;
        }).join('')}
      </div>
      <div class="cal-legend">
        <span><span class="cal-dot desaparecido"></span> Persona desaparecida</span>
        <span><span class="cal-dot buscado"></span> Persona requerida</span>
      </div>
    </div>

    ${seleccion ? `
      <div class="section-head">
        <div><h3>Casos del ${fmtFecha(seleccion)}</h3><div class="sub">${casosDelDia.length} resultado${casosDelDia.length===1?'':'s'}</div></div>
      </div>
      ${casosDelDia.length===0 ? `
        <div class="empty-state"><h4>No hay casos registrados en esta fecha</h4><p>Probá seleccionando otro día del calendario.</p></div>
      ` : `
        <div class="grid">${casosDelDia.map(c=>fichaCard(c)).join('')}</div>
      `}
    ` : ''}
  </main>`;
}

  <form class="form-card" id="form-nuevo-caso" style="max-width:100%;">
    <div class="form-grid">
      <div class="field"><label>Tipo de expediente *</label>
        <select required name="tipo"><option value="desaparecido">Persona desaparecida</option><option value="buscado">Persona requerida (se busca)</option></select>
      </div>
      <div class="field"><label>Nombre completo / alias *</label><input required name="nombre" type="text"></div>
      <div class="field"><label>Edad aproximada</label><input name="edad" type="number" min="0" max="120"></div>
      <div class="field"><label>Género</label><select name="genero"><option value="">Seleccionar…</option><option>Femenino</option><option>Masculino</option><option>Otro</option></select></div>
      <div class="field"><label>Provincia *</label><select required name="provincia"><option value="">Seleccionar…</option>${PROVINCIAS.map(p=>`<option>${p}</option>`).join('')}</select></div>
      <div class="field"><label>Fecha del hecho *</label><input required name="fecha" type="date"></div>
      <div class="field full"><label>Último lugar / zona conocida *</label><input required name="lugar" type="text"></div>
      <div class="field full"><label>Señas particulares</label><input name="senas" type="text"></div>
      <div class="field full"><label>Descripción del caso *</label><textarea required name="descripcion"></textarea></div>
      <div class="field full"><label>Fotografía (opcional)</label><input name="foto" type="file" accept="image/*"></div>
      <div class="field"><label><input type="checkbox" name="alerta" style="width:auto;display:inline-block;margin-right:6px;">Marcar como alerta activa</label></div>
    </div>
    <div class="form-footer">
      <button type="submit" class="btn btn-navy">Publicar expediente</button>
    </div>
  </form>`;
}

function panelEstadisticas(){
  const total = state.casos.length;
  const publicados = state.casos.filter(c=>c.status==='publicado').length;
  const pendientes = state.casos.filter(c=>c.status==='pendiente').length;
  const rechazados = state.casos.filter(c=>c.status==='rechazado').length;
  const desap = state.casos.filter(c=>c.tipo==='desaparecido').length;
  const busc = state.casos.filter(c=>c.tipo==='buscado').length;
  return `
  <div class="section-head"><div><h3>Estadísticas generales</h3><div class="sub">Resumen del sistema — datos de esta instancia de demostración</div></div></div>
  <div class="stats-grid">
    <div class="stat-card"><div class="n">${total}</div><div class="l">Expedientes totales</div></div>
    <div class="stat-card"><div class="n">${publicados}</div><div class="l">Publicados</div></div>
    <div class="stat-card"><div class="n">${pendientes}</div><div class="l">Pendientes de revisión</div></div>
    <div class="stat-card"><div class="n">${rechazados}</div><div class="l">Rechazados</div></div>
    <div class="stat-card"><div class="n">${desap}</div><div class="l">Personas desaparecidas</div></div>
    <div class="stat-card"><div class="n">${busc}</div><div class="l">Personas requeridas</div></div>
  </div>
  <div class="helper-note">Estas cifras reflejan únicamente los datos almacenados en este prototipo y no corresponden a estadísticas oficiales del OIJ.</div>`;
}

/* ==========================================================================
   RENDER — MODAL DE EDICIÓN (personal)
   ========================================================================== */
function renderEditModal(){
  const c = state.casos.find(x=>x.id===state.editCaso);
  if(!c) return '';
  return `
  <div class="overlay" id="overlay-edit">
    <div class="modal">
      <div class="modal-head">
        <h3 style="font-size:18px;">Editar expediente ${c.id}</h3>
        <button class="modal-close" id="btn-close-edit" aria-label="Cerrar">✕</button>
      </div>
      <div class="modal-body">
        <form id="form-editar-caso">
          <div class="form-grid">
            <div class="field"><label>Tipo de expediente *</label>
              <select required name="tipo">
                <option value="desaparecido" ${c.tipo==='desaparecido'?'selected':''}>Persona desaparecida</option>
                <option value="buscado" ${c.tipo==='buscado'?'selected':''}>Persona requerida (se busca)</option>
              </select>
            </div>
            <div class="field"><label>Nombre completo / alias *</label><input required name="nombre" type="text" value="${esc(c.nombre)}"></div>
            <div class="field"><label>Edad aproximada</label><input name="edad" type="number" min="0" max="120" value="${c.edad!=null? c.edad:''}"></div>
            <div class="field"><label>Género</label>
              <select name="genero">
                <option value="" ${!c.genero?'selected':''}>Seleccionar…</option>
                <option ${c.genero==='Femenino'?'selected':''}>Femenino</option>
                <option ${c.genero==='Masculino'?'selected':''}>Masculino</option>
                <option ${c.genero==='Otro'?'selected':''}>Otro</option>
              </select>
            </div>
            <div class="field"><label>Provincia *</label>
              <select required name="provincia">
                ${PROVINCIAS.map(p=>`<option ${c.provincia===p?'selected':''}>${p}</option>`).join('')}
              </select>
            </div>
            <div class="field"><label>Fecha del hecho *</label><input required name="fecha" type="date" value="${c.fecha||''}"></div>
            <div class="field full"><label>Último lugar / zona conocida *</label><input required name="lugar" type="text" value="${esc(c.lugar||'')}"></div>
            <div class="field full"><label>Señas particulares</label><input name="senas" type="text" value="${esc(c.senas||'')}"></div>
            <div class="field full"><label>Descripción del caso *</label><textarea required name="descripcion">${esc(c.descripcion||'')}</textarea></div>
            <div class="field full"><label>Reemplazar fotografía (opcional)</label><input name="foto" type="file" accept="image/*"><span class="hint">Dejalo vacío para conservar la fotografía actual.</span></div>
            <div class="field"><label><input type="checkbox" name="alerta" ${c.alerta?'checked':''} style="width:auto;display:inline-block;margin-right:6px;">Marcar como alerta activa</label></div>
          </div>
          <div class="form-footer">
            <button type="button" class="btn btn-ghost" id="btn-cancelar-edicion">Cancelar</button>
            <button type="submit" class="btn btn-navy">Guardar cambios</button>
          </div>
        </form>
      </div>
    </div>
  </div>`;
}

/* ==========================================================================
   RENDER — FOOTER
   ========================================================================== */
function renderFooter(){
  return `
  <footer>
    <div class="disclaimer">
      <b>Aviso:</b> este sitio es un prototipo funcional creado con fines de demostración y no pertenece ni representa al Organismo de Investigación Judicial (OIJ) de Costa Rica ni a ningún ente oficial. Para reportes, denuncias o información real sobre personas desaparecidas o requeridas, comunicate al <b>911</b> o al <b>800-8000-645</b>, o visitá los canales oficiales del Poder Judicial de Costa Rica.
    </div>
    <div>© 2026 — Prototipo de Sistema de Personas Buscadas</div>
  </footer>`;
}

/* ==========================================================================
   RENDER PRINCIPAL
   ========================================================================== */
function render(){
  const root = document.getElementById('root');
  if(state.loading){
    root.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--ink-600);font-family:'IBM Plex Sans',sans-serif;">Cargando sistema…</div>`;
    return;
  }
  let body = '';
  if(state.view==='inicio') body = renderInicio();
  else if(state.view==='calendario') body = renderCalendario();
  else if(state.view==='reportar') body = renderReportar();
  else if(state.view==='login') body = state.session? renderPanel() : renderLogin();
  else if(state.view==='panel') body = state.session? renderPanel() : renderLogin();

  root.innerHTML = `
    ${renderHeader()}
    ${body}
    ${state.modalCaso? renderModal() : ''}
    ${state.editCaso? renderEditModal() : ''}
    ${state.view==='inicio' || state.view==='reportar' || state.view==='calendario' ? renderFooter() : ''}
    ${state.toast? `<div class="toast">${esc(state.toast)}</div>` : ''}
  `;
  attachEvents();
}

/* ==========================================================================
   EVENTOS
   ========================================================================== */
function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    if(!file){ resolve(null); return; }
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function attachEvents(){
  document.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const target = btn.getAttribute('data-nav');
      if(target==='login' && state.session){ state.view='panel'; }
      else { state.view = target; }
      state.modalCaso=null;
      render();
    });
  });

  const calPrev = document.getElementById('cal-prev');
  if(calPrev) calPrev.addEventListener('click', ()=>{
    state.calMonth--; if(state.calMonth<0){ state.calMonth=11; state.calYear--; }
    render();
  });
  const calNext = document.getElementById('cal-next');
  if(calNext) calNext.addEventListener('click', ()=>{
    state.calMonth++; if(state.calMonth>11){ state.calMonth=0; state.calYear++; }
    render();
  });
  const calHoy = document.getElementById('cal-hoy');
  if(calHoy) calHoy.addEventListener('click', ()=>{
    const hoy = new Date();
    state.calYear = hoy.getFullYear(); state.calMonth = hoy.getMonth();
    render();
  });
  document.querySelectorAll('[data-cal-day]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const iso = el.getAttribute('data-cal-day');
      state.calSelected = state.calSelected===iso ? null : iso;
      render();
    });
  });

  const btnIrReportar = document.getElementById('btn-ir-reportar');
  if(btnIrReportar) btnIrReportar.addEventListener('click', ()=>{ state.view='reportar'; render(); });

  const btnBuscar = document.getElementById('btn-buscar');
  if(btnBuscar) btnBuscar.addEventListener('click', ()=>{
    state.filtroTexto = document.getElementById('buscador').value;
    state.filtroTipo = document.getElementById('filtro-tipo').value;
    state.filtroProvincia = document.getElementById('filtro-provincia').value;
    render();
  });
  const buscadorInput = document.getElementById('buscador');
  if(buscadorInput) buscadorInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ btnBuscar.click(); } });

  document.querySelectorAll('[data-open-caso]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.modalCaso = el.getAttribute('data-open-caso'); render(); });
    el.addEventListener('keydown', e=>{ if(e.key==='Enter'){ state.modalCaso = el.getAttribute('data-open-caso'); render(); }});
  });
  const overlay = document.getElementById('overlay');
  if(overlay) overlay.addEventListener('click', e=>{ if(e.target.id==='overlay'){ state.modalCaso=null; render(); }});
  const btnCloseModal = document.getElementById('btn-close-modal');
  if(btnCloseModal) btnCloseModal.addEventListener('click', ()=>{ state.modalCaso=null; render(); });

  const btnCancelarReporte = document.getElementById('btn-cancelar-reporte');
  if(btnCancelarReporte) btnCancelarReporte.addEventListener('click', ()=>{ state.view='inicio'; render(); });

  const formReportar = document.getElementById('form-reportar');
  if(formReportar) formReportar.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(formReportar);
    const foto = await fileToDataUrl(fd.get('foto'));
    const nuevo = {
      id: uid(), tipo:'desaparecido', status:'pendiente',
      nombre: fd.get('nombre'), edad: fd.get('edad')? Number(fd.get('edad')):null,
      genero: fd.get('genero'), provincia: fd.get('provincia'), fecha: fd.get('fecha'),
      lugar: fd.get('lugar'), senas: fd.get('senas'), descripcion: fd.get('descripcion'),
      alerta:false, foto, reportadoPor:'ciudadano', contacto: fd.get('contacto')
    };
    state.casos.push(nuevo);
    await guardarCasos();
    formReportar.reset();
    mostrarToast('Reporte enviado automáticamente. Quedó pendiente de revisión por el personal.');
  });

  const formLogin = document.getElementById('form-login');
  if(formLogin) formLogin.addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(formLogin);
    const u = (fd.get('usuario')||'').toString().trim().toLowerCase();
    const p = (fd.get('password')||'').toString().trim();
    const match = DEMO_USERS.find(x=>x.usuario.toLowerCase()===u && x.password===p);
    if(match){
      state.session = { usuario:match.usuario, nombre:match.nombre, rol:match.rol };
      state.loginError=''; state.view='panel'; state.panelTab='publicados';
      guardarSesion();
    } else {
      state.loginError = 'Usuario o contraseña incorrectos. Revisá mayúsculas y espacios.';
    }
    render();
  });

  const btnLogout = document.getElementById('btn-logout');
  if(btnLogout) btnLogout.addEventListener('click', ()=>{
    state.session=null; state.view='inicio'; guardarSesion(); render();
  });

  document.querySelectorAll('[data-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.panelTab = btn.getAttribute('data-tab'); render(); });
  });

  document.querySelectorAll('[data-view-caso]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.modalCaso = el.getAttribute('data-view-caso'); render(); });
  });

  document.querySelectorAll('[data-edit-caso]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.editCaso = el.getAttribute('data-edit-caso'); render(); });
  });
  const overlayEdit = document.getElementById('overlay-edit');
  if(overlayEdit) overlayEdit.addEventListener('click', e=>{ if(e.target.id==='overlay-edit'){ state.editCaso=null; render(); }});
  const btnCloseEdit = document.getElementById('btn-close-edit');
  if(btnCloseEdit) btnCloseEdit.addEventListener('click', ()=>{ state.editCaso=null; render(); });
  const btnCancelarEdicion = document.getElementById('btn-cancelar-edicion');
  if(btnCancelarEdicion) btnCancelarEdicion.addEventListener('click', ()=>{ state.editCaso=null; render(); });

  const formEditar = document.getElementById('form-editar-caso');
  if(formEditar) formEditar.addEventListener('submit', async e=>{
    e.preventDefault();
    const c = state.casos.find(x=>x.id===state.editCaso);
    if(!c) return;
    const fd = new FormData(formEditar);
    const nuevaFoto = await fileToDataUrl(fd.get('foto'));
    c.tipo = fd.get('tipo');
    c.nombre = fd.get('nombre');
    c.edad = fd.get('edad')? Number(fd.get('edad')) : null;
    c.genero = fd.get('genero');
    c.provincia = fd.get('provincia');
    c.fecha = fd.get('fecha');
    c.lugar = fd.get('lugar');
    c.senas = fd.get('senas');
    c.descripcion = fd.get('descripcion');
    c.alerta = fd.get('alerta')==='on';
    if(nuevaFoto) c.foto = nuevaFoto;
    await guardarCasos();
    state.editCaso = null;
    mostrarToast('Cambios guardados correctamente.');
  });

  document.querySelectorAll('[data-republicar]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id = el.getAttribute('data-republicar');
      const c = state.casos.find(x=>x.id===id);
      if(c){ c.status='publicado'; await guardarCasos(); mostrarToast('Expediente republicado.'); }
    });
  });

  document.querySelectorAll('[data-eliminar]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id = el.getAttribute('data-eliminar');
      if(confirm('¿Eliminar este expediente de forma permanente? Esta acción no se puede deshacer.')){
        state.casos = state.casos.filter(x=>x.id!==id);
        await guardarCasos();
        mostrarToast('Expediente eliminado permanentemente.');
      }
    });
  });

  document.querySelectorAll('[data-toggle-alerta]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id = el.getAttribute('data-toggle-alerta');
      const c = state.casos.find(x=>x.id===id);
      if(c){ c.alerta = !c.alerta; await guardarCasos(); mostrarToast(c.alerta?'Alerta activada.':'Alerta desactivada.'); }
    });
  });

  document.querySelectorAll('[data-retirar]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id = el.getAttribute('data-retirar');
      const c = state.casos.find(x=>x.id===id);
      if(c && confirm('¿Retirar este expediente de la publicación pública?')){
        c.status='rechazado';
        await guardarCasos();
        mostrarToast('Expediente retirado de la vista pública.');
      }
    });
  });

  document.querySelectorAll('[data-aprobar]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id = el.getAttribute('data-aprobar');
      const c = state.casos.find(x=>x.id===id);
      if(c){ c.status='publicado'; await guardarCasos(); mostrarToast('Reporte aprobado y publicado.'); }
    });
  });

  document.querySelectorAll('[data-rechazar]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id = el.getAttribute('data-rechazar');
      const c = state.casos.find(x=>x.id===id);
      if(c && confirm('¿Rechazar este reporte ciudadano?')){
        c.status='rechazado'; await guardarCasos(); mostrarToast('Reporte rechazado.');
      }
    });
  });

  const formNuevo = document.getElementById('form-nuevo-caso');
  if(formNuevo) formNuevo.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(formNuevo);
    const foto = await fileToDataUrl(fd.get('foto'));
    const nuevo = {
      id: uid(), tipo: fd.get('tipo'), status:'publicado',
      nombre: fd.get('nombre'), edad: fd.get('edad')? Number(fd.get('edad')):null,
      genero: fd.get('genero'), provincia: fd.get('provincia'), fecha: fd.get('fecha'),
      lugar: fd.get('lugar'), senas: fd.get('senas'), descripcion: fd.get('descripcion'),
      alerta: fd.get('alerta')==='on', foto, reportadoPor:'personal', contacto:'800-8000-645'
    };
    state.casos.push(nuevo);
    await guardarCasos();
    formNuevo.reset();
    state.panelTab='publicados';
    mostrarToast('Expediente publicado correctamente.');
  });
}

/* ==========================================================================
   INICIO
   ========================================================================== */
(async function init(){
  state.loading = false;
  render(); // pinta la interfaz de inmediato (login, calendario, formularios ya son usables)
  await cargarSesion();
  await cargarCasos(); // vuelve a pintar cuando los datos guardados estén listos
})();
</script>
</body>
</html>
